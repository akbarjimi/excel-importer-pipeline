name: Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            testbench: '8'
            laravel: '10'
          - php: '8.2'
            testbench: '8'
            laravel: '10'
          - php: '8.2'
            testbench: '9'
            laravel: '11'
          - php: '8.2'
            testbench: '10'
            laravel: '12'
          - php: '8.3'
            testbench: '8'
            laravel: '10'
          - php: '8.3'
            testbench: '9'
            laravel: '11'
          - php: '8.3'
            testbench: '10'
            laravel: '12'
          - php: '8.4'
            testbench: '9'
            laravel: '11'
          - php: '8.4'
            testbench: '10'
            laravel: '12'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, zip, gd, sqlite3, pdo_sqlite
          coverage: ${{ matrix.php == '8.2' && matrix.testbench == '8' && 'pcov' || 'none' }}
          ini-values: memory_limit=512M

      - name: Install dependencies
        run: |
          composer require --no-interaction --no-update \
            "orchestra/testbench:^${{ matrix.testbench }}"
          composer install --prefer-dist --no-interaction --no-progress

      - name: Run tests with coverage
        if: matrix.php == '8.2' && matrix.testbench == '8'
        run: vendor/bin/pest --coverage --ci

      - name: Run tests
        if: matrix.php != '8.2' || matrix.testbench != '8'
        run: vendor/bin/pest --ci